[tools]
bun = "1.3.10"
node = "24"
go = "1.26"
rust = "1.91.0"

[tasks.setup]
description = "Install JavaScript dependencies with Bun"
run = "bun install"

[tasks.server]
description = "Build the native AI agent server"
dir = "{{config_root}}/sidexai/sidex-server"
run = "go build -tags fts5 -o sidex-server ./cmd/server"

[tasks.frontend]
description = "Run the frontend development server"
run = """
bun run setup
node --max-old-space-size=8192 node_modules/vite/bin/vite.js
"""

[tasks.dev]
description = "Build the agent server and launch SideX desktop development"
depends = ["setup", "server"]
run = '''bun run tauri dev --config '{"build":{"beforeDevCommand":"mise run frontend"}}' '''